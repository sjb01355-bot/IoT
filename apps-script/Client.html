<script>
const $ = (selector) => document.querySelector(selector);
const paths = {
  logo:'<path d="M3 10a14 14 0 0 1 18 0M6 13a9 9 0 0 1 12 0m-9 3a4 4 0 0 1 6 0"/><circle cx="12" cy="19" r="1"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  users:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a5 5 0 0 1 5-5h2a5 5 0 0 1 5 5v2m2-15a3 3 0 0 1 0 6m1 2a5 5 0 0 1 3 5v2"/>',
  file:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8m-8 4h8m-8 4h5"/>',
  box:'<path d="m3 7 9-4 9 4v10l-9 4-9-4zm0 0 9 4 9-4m-9 4v10m-4-16 9 4"/>',
  building:'<path d="M5 21V4h11v17M3 21h18m-5-12h3v12M8 8h1m3 0h1m-5 4h1m3 0h1m-3 9v-5h2v5"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/>',
  chevron:'<path d="m9 5 7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  upload:'<path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/>',
  download:'<path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/>',
  search:'<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>',
};
const icon = (name) => '<svg viewBox="0 0 24 24" aria-hidden="true">' + paths[name] + '</svg>';
for (const element of document.querySelectorAll('[data-icon]')) element.innerHTML = icon(element.dataset.icon);

const labels = {overview:'대시보드', participants:'참여자 관리', logs:'모니터링 일지', devices:'기기 보급 현황'};
const dateFormat = new Intl.DateTimeFormat('ko-KR', {dateStyle:'full', timeZone:'Asia/Seoul'});
const today = new Intl.DateTimeFormat('sv-SE', {timeZone:'Asia/Seoul'}).format(new Date());
$('#today').textContent = dateFormat.format(new Date());
const esc = (value = '') => String(value ?? '').replace(/[&<>"']/g, (char) => ({
  '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
}[char]));
const text = (value) => esc(value || '—');
const count = (p) => Object.values(p.quantities).reduce((a,b) => a+b,0);
const number = (value) => value.toLocaleString('ko-KR');
const demos = [
  ['가상 참여자 A','양주', [1,1,2,1,1,1,2,1,1,0,1]],
  ['가상 참여자 B','의정부', [1,1,1,1,1,0,1,1,1]],
  ['가상 참여자 C','포천', [1,0,1,1,1,0,2,1,1]],
  ['가상 참여자 D','동두천', [1,1,1,1,1,1,1,0,1]],
  ['가상 참여자 E','양주', []],
  ['가상 참여자 F','포천', []],
];
let state = {participants:[],logs:[],devices:[]};
let sample = true;
let view = 'overview';
let toastTimer;

function readAsDataUrl(file) {
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>resolve(reader.result);
    reader.onerror = ()=>reject(new Error('파일을 읽을 수 없습니다.'));
    reader.readAsDataURL(file);
  });
}

async function api(path, method='GET', body=null) {
  if (body instanceof File) {
    if (body.size > 6000000) throw new Error('6MB 이하의 엑셀 파일을 선택해 주세요.');
    body = (await readAsDataUrl(body)).split(',')[1];
  }
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve)
      .withFailureHandler(error=>reject(new Error(error.message || '요청을 처리할 수 없습니다.')))
      .oasisRequest(path, method, body);
  });
}

async function refresh() {
  state = await api('state');
  if (state.participants.length) sample = false;
  render();
}

function notify(message) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {toast.hidden = true;}, 4000);
}

function records() {
  if (!sample) return state;
  const participants = demos.map(([name,region,qty],index) => ({
    id:-index-1, name, region, status:qty.length ? '설치 완료' : '설치 대기',
    quantities:Object.fromEntries(qty.map((value,i) => [state.devices[i],value])),
  }));
  const logs = participants.slice(0,4).map((p,i) => ({
    id:p.id, participant_id:p.id, date:today.slice(0,8)+'0'+(8-i), time:'14:00',
    channels:[i%2 ? '내방' : '전화'], checks:['도어락'],
    content:['스마트 도어락 및 스위치 작동 상태 점검','기기 사용 안내 및 문의 사항 확인','미니 스위치 연결 상태 확인','설치 후 초기 사용 상담'][i],
  }));
  return {participants,logs};
}

const button = (label, action, symbol, primary=false) =>
  '<button type="button" class="btn'+(primary?' primary':'')+'" data-action="'+action+'">'+(symbol?icon(symbol):'')+label+'</button>';
const page = (title, description, actions='') =>
  '<div class="page-head"><div><h1>'+title+'</h1><p>'+description+'</p></div><div class="actions">'+actions+'</div></div>';
const panel = (title, extra='', subtitle='') =>
  '<div class="panel-title"><div><h2>'+title+'</h2>'+(subtitle?'<p>'+subtitle+'</p>':'')+'</div>'+extra+'</div>';
const empty = (message) => '<div class="empty">'+message+'</div>';
const table = (headers, rows, message) => rows.length ?
  '<div class="table-wrap"><table><thead><tr>'+headers.map(h=>'<th scope="col">'+h+'</th>').join('')+
  '</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>' : empty(message);
const personLink = (p) => p ?
  '<div class="person"><span class="avatar">'+esc(p.name[0])+'</span><button class="row-link" data-person="'+p.id+'">'+esc(p.name)+'</button></div>' : '—';
const pill = (value, type='') => '<span class="pill '+type+'">'+esc(value)+'</span>';

function logTable(logs, participants, compact=false) {
  const people = new Map(participants.map(p => [p.id,p]));
  return table(['참여자','일시','상담 유형',compact?'':'상담 내용'].filter(Boolean),logs.map(log =>
    '<tr><td>'+personLink(people.get(log.participant_id))+'</td><td><button class="row-link" data-log="'+log.id+'">'+text(log.date)+
    '</button>'+(!compact && log.time?' '+esc(log.time):'')+'</td><td>'+log.channels.map(c=>pill(c,'channel')).join(' ')+'</td>'+
    (compact?'':'<td><button class="row-link" data-log="'+log.id+'">'+esc(log.content.slice(0,45))+(log.content.length>45?'…':'')+'</button></td>')+'</tr>'),'작성된 모니터링 일지가 없습니다.');
}

function totals(participants, finishedOnly = false) {
  const selected = finishedOnly ? participants.filter(p => p.status === '설치 완료') : participants;
  return state.devices.map(device => [device,selected.reduce((total,p) => total+(p.quantities[device]||0),0)]);
}

const artwork = '<svg viewBox="0 0 330 185" aria-hidden="true"><g fill="none" stroke="#8fbafa" stroke-width="1">'+
  '<circle opacity=".38" cx="202" cy="91" r="58"/><circle opacity=".27" cx="202" cy="91" r="76"/><circle opacity=".2" cx="202" cy="91" r="98"/>'+
  '<path opacity=".65" stroke-dasharray="4 5" d="M68 129h37l33-27h22m76-28h24l22-25m-55 77h29l29 23" />'+
  '<rect x="165" y="54" width="74" height="74" rx="18" fill="#4077d0"/><path stroke="#fff" stroke-width="3" d="M184 86q18-16 36 0m-31 8q13-11 26 0m-20 8q7-7 14 0"/><circle cx="202" cy="111" r="2" fill="#fff"/>'+
  '<rect x="56" y="114" width="32" height="32" rx="8" fill="#3569bd"/><path d="M66 129l6-5 6 5v8H66z" stroke="#e6f0ff"/>'+
  '<rect x="272" y="32" width="32" height="32" rx="8" fill="#447bd1"/><path d="M282 45l6-3 6 3v7l-6 3-6-3zm0 0 6 3 6-3" stroke="#e6f0ff"/>'+
  '<rect x="271" y="134" width="32" height="32" rx="8" fill="#447bd1"/><path d="M281 148h12m-12 5h8" stroke="#e6f0ff"/>'+
  '</g></svg>';

function overview(participants, logs) {
  const installed = participants.filter(p=>p.status==='설치 완료').length;
  const supplied = totals(participants, true).reduce((a,[,quantity])=>a+quantity,0);
  const month = logs.filter(log=>log.date.startsWith(today.slice(0,7))).length;
  const byRegion = Object.entries(participants.reduce((all,p) => {
    const region = p.region || '미지정';
    all[region] = (all[region] || 0) + 1;
    return all;
  }, Object.create(null))).sort((a,b)=>b[1]-a[1]);
  const metrics = [['전체 참여자',participants.length,'명','users','등록된 참여자'],['설치 완료',installed,'명','check','전체 참여자 중 '+(participants.length?Math.round(installed/participants.length*100):0)+'%'],['보급 기기',supplied,'대','box','설치 완료 참여자 기준'],['이번 달 일지',month,'건','file','전체 일지 '+logs.length+'건']];
  return '<section class="hero"><div class="hero-copy"><h2>경기북부 성인장애인 IoT 보급사업</h2><p>참여자별 설치 현황과 모니터링 기록을 확인하세요.</p>'+
    '<a class="btn" href="#participants">참여자 현황 보기 '+icon('chevron')+'</a></div><div class="hero-art">'+artwork+'</div></section>'+
    '<section class="metrics" aria-label="사업 현황">'+metrics.map(([label,value,unit,symbol,note])=>'<article class="metric"><span class="metric-label">'+label+
      '</span><strong class="metric-number">'+number(value)+'<small>'+unit+'</small></strong><span class="metric-icon">'+icon(symbol)+'</span><span class="metric-note">'+note+'</span></article>').join('')+'</section>'+
    '<div class="dashboard-grid"><section class="panel">'+panel('최근 모니터링 일지','<a href="#logs" class="text-button">전체 보기 →</a>')+
    logTable(sortedLogs(logs).slice(0,5),participants,true)+'</section><section class="panel">'+panel('지역별 참여자','', '등록 인원 기준')+
    (byRegion.length?'<div class="bars">'+byRegion.map(([region,value])=>'<div><div class="bar-label"><span>'+esc(region)+'</span><strong>'+value+
    '명</strong></div><div class="track"><span style="width:'+100*value/byRegion[0][1]+'%"></span></div></div>').join('')+'</div>':empty('등록된 참여자가 없습니다.'))+'</section></div>';
}

const sortedLogs = (logs) => [...logs].sort((a,b)=>(b.date+' '+(b.time||'')).localeCompare(a.date+' '+(a.time||'')) || b.id-a.id);

function render() {
  view = Object.hasOwn(labels, location.hash.slice(1)) ? location.hash.slice(1) : 'overview';
  $('#crumb').textContent = labels[view];
  document.querySelectorAll('nav a').forEach(link=>{
    const isActive = link.dataset.view===view;
    link.classList.toggle('active',isActive);
    if (isActive) link.setAttribute('aria-current','page'); else link.removeAttribute('aria-current');
  });
  const {participants,logs} = records();
  const importButton = button('엑셀 가져오기','import','upload');
  const logButton = button('일지 작성','new-log','plus',true);
  const personButton = button('참여자 등록','new-person','plus',true);
  const headers = {
    overview:['사업 대시보드','오아시스 사업의 주요 현황을 한눈에 확인하세요.',importButton+logButton],
    participants:[labels.participants,'참여자 정보와 설치 상태를 관리하세요.',importButton+personButton],
    logs:[labels.logs,'참여자별 상담과 기기 점검 기록을 관리하세요.',logButton],
    devices:[labels.devices,'기기별 등록 수량과 설치 완료 수량을 확인하세요.',''],
  };
  const search = (placeholder) => '<label class="search">'+icon('search')+'<input id="search" type="search" aria-label="'+placeholder+'" placeholder="'+placeholder+'"></label>';
  const regionOptions = [...new Set(participants.map(p=>p.region).filter(Boolean))].sort().map(r=>'<option>'+esc(r)+'</option>').join('');
  let content;
  if (view==='overview') content=overview(participants,logs);
  if (view==='participants') content='<section class="panel"><div class="toolbar">'+search('이름, 연락처, 주소 검색')+
    '<select id="region" aria-label="지역"><option value="">전체 지역</option>'+regionOptions+'</select><select id="status" aria-label="설치 상태"><option value="">전체 상태</option><option>설치 완료</option><option>설치 대기</option></select></div><div id="results"></div></section>';
  if (view==='logs') content='<section class="panel"><div class="toolbar">'+search('참여자 또는 상담 내용 검색')+
    '<select id="channel" aria-label="상담 유형"><option value="">전체 상담 유형</option><option>전화</option><option>내방</option><option>기타</option></select></div><div id="results"></div></section>';
  if (view==='devices') {
    const confirmed = Object.fromEntries(totals(participants,true));
    content='<div class="device-grid">'+totals(participants).map(([device,value])=>'<article class="panel device-card"><span class="metric-label">'+
      esc(device)+'</span><strong>'+number(confirmed[device])+'<small>대 설치 완료</small></strong><span class="metric-note">등록 수량 '+number(value)+'대</span></article>').join('')+'</div>';
  }
  $('#main').innerHTML=page(...headers[view])+(sample?'<div class="demo">'+icon('info')+
    '<span>가상 예시 데이터를 표시하고 있습니다.</span><button class="text-button" data-action="hide-sample">예시 숨기기</button></div>':'')+content;
  if ($('#results')) {
    updateTable();
    $('#search').addEventListener('input',updateTable);
    for (const select of document.querySelectorAll('.toolbar select')) select.addEventListener('change',updateTable);
  }
}

function updateTable() {
  const {participants,logs} = records();
  const query = $('#search').value.trim().toLowerCase();
  if (view==='participants') {
    const region = $('#region').value, status = $('#status').value;
    const selected = participants.filter(p=>(!region || p.region===region) && (!status || p.status===status) &&
      [p.name,p.phone,p.address].some(value=>(value||'').toLowerCase().includes(query)));
    $('#results').innerHTML=table(['이름','지역','연락처','설치 상태','기기 수량','일지'],selected.map(p=>
      '<tr><td>'+personLink(p)+'</td><td>'+text(p.region)+'</td><td>'+text(p.phone)+'</td><td>'+
      pill(p.status,p.status==='설치 완료'?'done':'wait')+'</td><td>'+count(p)+'대</td><td>'+logs.filter(l=>l.participant_id===p.id).length+
      '건</td></tr>'),'조건에 맞는 참여자가 없습니다.');
  } else {
    const channel = $('#channel').value;
    const people = new Map(participants.map(p=>[p.id,p.name]));
    $('#results').innerHTML=logTable(sortedLogs(logs.filter(l=>(!channel || l.channels.includes(channel)) &&
      [people.get(l.participant_id),l.content].some(v=>(v||'').toLowerCase().includes(query)))),participants);
  }
}

const dialog = $('#dialog');
const field = (label, control) => '<label class="field">'+label+control+'</label>';
const input = (name,value='',type='text',attributes='') => '<input type="'+type+'" name="'+name+'" value="'+esc(value)+'" '+attributes+'>';
const area = (name,value='',required=false,rows=3) => '<textarea name="'+name+'" rows="'+rows+'" maxlength="10000" '+(required?'required':'')+'>'+esc(value)+'</textarea>';
const option = (value,label,selected) => '<option value="'+esc(value)+'" '+(String(value)===String(selected)?'selected':'')+'>'+esc(label)+'</option>';
const closeButton = button('닫기','close');
const submitButton = '<button class="btn primary" type="submit">저장</button>';

function openDialog(title, content, footer, handler, kind='') {
  dialog.className=kind;
  $('#dialog-inner').innerHTML='<form><div class="dialog-head"><h2 id="dialog-title">'+title+'</h2>'+closeButton+
    '</div><div class="dialog-body">'+content+'<p class="form-error" role="alert" hidden></p></div><div class="dialog-foot">'+footer+'</div></form>';
  dialog.setAttribute('aria-labelledby','dialog-title');
  if (!dialog.open) dialog.showModal();
  const form = dialog.querySelector('form');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!handler) return;
    const submit = form.querySelector('[type=submit]');
    submit.disabled = true;
    try {
      await handler(new FormData(form));
      dialog.close();
      await refresh();
      notify('저장했습니다.');
    } catch (error) {
      const message = form.querySelector('.form-error');
      message.textContent = error.message;
      message.hidden = false;
    } finally {
      submit.disabled = false;
    }
  });
}

function personForm(p = {}) {
  const selects = '<select name="status">'+['설치 대기','설치 완료'].map(s=>option(s,s,p.status)).join('')+'</select>';
  const quantities = '<div class="quantity-grid">'+state.devices.map(d=>field(esc(d),input('qty:'+d,p.quantities?.[d]||0,'number','min="0" max="9999" step="1"'))).join('')+'</div>';
  openDialog(p.id?'참여자 수정':'참여자 등록','<div class="fields">'+field('이름',input('name',p.name,'text','required maxlength="100"'))+
    field('지역',input('region',p.region,'text','maxlength="100"'))+field('연락처',input('phone',p.phone,'tel','maxlength="100"'))+
    field('설치 상태',selects)+'</div>'+field('주소',input('address',p.address,'text','maxlength="300"'))+
    field('모니터링 메모',area('memo',p.memo))+'<strong>기기별 수량</strong>'+quantities,submitButton,async form=>{
      const body=Object.fromEntries(['name','region','phone','status','address','memo'].map(k=>[k,form.get(k)]));
      body.quantities=Object.fromEntries(state.devices.map(d=>[d,Number(form.get('qty:'+d)||0)]).filter(([,qty])=>qty));
      await api('participants'+(p.id?'/'+p.id:''),p.id?'PUT':'POST',body);
      location.hash='participants';
    });
}

function logForm(log = {}, selected) {
  if (!state.participants.length) return openDialog('일지 작성','<p class="detail-text">먼저 참여자를 등록하거나 엑셀 명단을 가져와 주세요.</p>',
    button('엑셀 가져오기','import','upload')+button('참여자 등록','new-person','plus',true));
  const checks = (name,label,values,checked=[]) => '<fieldset class="log-checks"><legend>'+label+'</legend><div class="check-grid">'+
    values.map(v=>'<label><input type="checkbox" name="'+name+'" value="'+esc(v)+'" '+
    (checked.includes(v)?'checked':'')+'> '+esc(v)+'</label>').join('')+'</div></fieldset>';
  const people = '<select name="participant_id" required><option value="">참여자 선택</option>'+state.participants.map(p=>
    option(p.id,p.name+(p.region?' · '+p.region:''),log.participant_id??selected)).join('')+'</select>';
  openDialog(log.id?'일지 수정':'일지 작성','<div class="log-layout"><div class="log-context">'+
    field('참여자',people)+'<div class="fields">'+field('상담 날짜',input('date',log.date||today,'date','required'))+
    field('상담 시간',input('time',log.time,'time'))+'</div>'+
    checks('channels','상담 유형',['전화','내방','기타'],log.channels)+checks('checks','기기 점검',state.devices,log.checks)+
    '</div><div class="log-writing">'+field('상담 내용',area('content',log.content,true,10))+
    field('슈퍼비전',area('supervision',log.supervision,false,5))+field('사진 (JPG, PNG, WebP · 최대 3MB)',
    '<input type="file" name="photo" accept="image/jpeg,image/png,image/webp">')+
    (log.hasPhoto?'<label><input type="checkbox" name="removePhoto"> 기존 사진 삭제</label>':'')+
    '</div></div>',submitButton,async form=>{
      const file=form.get('photo');
      if (file.size>3000000) throw new Error('사진은 3MB 이하로 첨부해 주세요.');
      const photo=file.size ? await readAsDataUrl(file) : '';
      const keepPhoto=Boolean(log.hasPhoto && !file.size && !form.has('removePhoto'));
      const body=Object.fromEntries(['participant_id','date','time','content','supervision'].map(k=>[k,form.get(k)]));
      await api('logs'+(log.id?'/'+log.id:''),log.id?'PUT':'POST',
        {...body,channels:form.getAll('channels'),checks:form.getAll('checks'),photo,keepPhoto});
      location.hash='logs';
    },'log-editor');
}

function personDetail(p) {
  const logs=sortedLogs(records().logs.filter(l=>l.participant_id===p.id));
  const devices=Object.entries(p.quantities).filter(([,qty])=>qty).map(([d,qty])=>pill(d+' '+qty+'대')).join(' ');
  openDialog(esc(p.name),'<div class="fields">'+
    '<div><strong>지역</strong><p>'+text(p.region)+'</p></div><div><strong>연락처</strong><p>'+text(p.phone)+'</p></div></div>'+
    '<strong>주소</strong><p class="detail-text">'+text(p.address)+'</p><strong>모니터링 메모</strong><p class="detail-text">'+text(p.memo)+'</p>'+
    '<strong>'+esc(p.status)+' · 기기 '+count(p)+'대</strong><div>'+(devices||'—')+'</div><strong>모니터링 일지</strong>'+
    (logs.length?'<div>'+logs.map(l=>'<button type="button" class="btn" data-log="'+l.id+'">'+esc(l.date)+'</button>').join(' ')+'</div>':empty('작성된 일지가 없습니다.')),
    p.id>0?button('삭제','delete-person:'+p.id)+button('수정','edit-person:'+p.id)+button('일지 작성','new-log:'+p.id,'plus',true):'');
}

function logDetail(log) {
  const participant=records().participants.find(p=>p.id===log.participant_id);
  openDialog('모니터링 일지','<strong>'+text(participant?.name)+' · '+text(log.date)+' '+esc(log.time)+'</strong>'+
    '<div>'+log.channels.map(c=>pill(c,'channel')).join(' ')+'</div><strong>점검 기기</strong><div>'+text(log.checks.join(', '))+'</div>'+
    '<strong>상담 내용</strong><p class="detail-text">'+text(log.content)+'</p><strong>슈퍼비전</strong><p class="detail-text">'+text(log.supervision)+'</p>'+
    (log.photo?'<img class="photo" alt="모니터링 첨부 사진" src="'+esc(log.photo)+'">':''),
    log.id>0?button('삭제','delete-log:'+log.id)+button('다운로드','download-log','download')+
      button('수정','edit-log:'+log.id,undefined,true):'');
  dialog.querySelector('[data-action="download-log"]')?.addEventListener('click',()=>downloadLog(log,participant));
}

function downloadLog(log, participant) {
  const details = [
    ['참여자',participant?.name],
    ['상담 일시',[log.date,log.time].filter(Boolean).join(' ')],
    ['상담 유형',log.channels.join(', ')],
    ['점검 기기',log.checks.join(', ')],
    ['상담 내용',log.content],
    ['슈퍼비전',log.supervision],
  ];
  const photo = log.photo ? '<section><h2>사진</h2><img alt="모니터링 첨부 사진" src="'+esc(log.photo)+'"></section>' : '';
  const documentHtml = '<!doctype html><html lang="ko"><head><meta charset="utf-8">'+
    '<meta name="viewport" content="width=device-width, initial-scale=1">'+
    '<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:">'+
    '<title>IoT 모니터링 일지</title><style>body{font:15px/1.65 system-ui,sans-serif;color:#15253b;max-width:760px;margin:32px auto;padding:0 20px}'+
    'h1{font-size:24px;border-bottom:2px solid #235cdf;padding-bottom:10px}section{margin:16px 0}h2{font-size:14px;margin:0 0 4px}'+
    'p{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}img{max-width:100%;max-height:18cm;object-fit:contain}'+
    '@media print{body{margin:0;padding:0}h2{break-after:avoid}img{break-inside:avoid}}</style></head><body>'+
    '<h1>IoT 모니터링 일지</h1>'+details.map(([label,value])=>'<section><h2>'+label+'</h2><p>'+text(value)+'</p></section>').join('')+
    photo+'</body></html>';
  const url = URL.createObjectURL(new Blob([documentHtml],{type:'text/html;charset=utf-8'}));
  const link = document.createElement('a');
  const name = (participant?.name || '참여자').replace(/[<>:"/\\|?*\u0000-\u001f]/g,'_');
  link.href = url;
  link.download = 'IoT 모니터링 일지_'+name+'_'+log.date+'_'+log.id+'.html';
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}

async function action(name,id) {
  if (name==='close') return dialog.close();
  if (name==='import') return $('#roster-file').click();
  if (name==='new-person') return personForm();
  if (name==='new-log') return logForm({},id);
  if (name==='hide-sample') {
    sample=false;
    return render();
  }
  if (name==='edit-person') return personForm(state.participants.find(p=>p.id===id));
  if (name==='edit-log') return logForm(state.logs.find(l=>l.id===id));
  if (name==='delete-person' || name==='delete-log') {
    const person=name==='delete-person';
    if (!confirm(person?'참여자와 연결된 일지를 모두 삭제하시겠습니까?':'이 일지를 삭제하시겠습니까?')) return;
    await api((person?'participants/':'logs/')+id,'DELETE');
    dialog.close();
    await refresh();
    notify('삭제했습니다.');
  }
}

document.addEventListener('click',event=>{
  const navigation=event.target.closest('a[href^="#"]');
  if (navigation && Object.hasOwn(labels,navigation.getAttribute('href').slice(1))) {
    event.preventDefault();
    location.hash=navigation.getAttribute('href');
    return;
  }
  const target=event.target.closest('[data-action], [data-person], [data-log]');
  if (!target) return;
  const {action:command,person,log}=target.dataset;
  if (command) {
    const [name,id]=command.split(':');
    action(name,Number(id)).catch(error=>notify(error.message));
  }
  if (person) personDetail(records().participants.find(p=>p.id===Number(person)));
  if (log) {
    const record=records().logs.find(l=>l.id===Number(log));
    if (record.hasPhoto) {
      target.disabled=true;
      api('logs/'+log+'/photo').then(({photo})=>logDetail({...record,photo}))
        .catch(error=>notify(error.message)).finally(()=>{target.disabled=false;});
    } else logDetail(record);
  }
});

$('#roster-file').addEventListener('change',async event=>{
  const file=event.target.files[0];
  event.target.value='';
  if (!file) return;
  if (!confirm('엑셀 명단을 가져오시겠습니까? 같은 엑셀 번호로 이미 가져온 참여자 정보와 기기 수량은 업데이트됩니다.')) return;
  try {
    const result=await api('import','POST',file);
    if (dialog.open) dialog.close();
    location.hash='participants';
    await refresh();
    notify('참여자 '+result.count+'명의 정보를 가져왔습니다.');
  } catch (error) {
    notify(error.message);
  }
});
window.addEventListener('hashchange',render);
refresh().catch(error=>{ $('#main').textContent='데이터를 불러올 수 없습니다. '+error.message; });
</script>
