dialog.log-editor {
  width: min(1060px, calc(100% - 32px));
  max-height: 92dvh;
  overflow: hidden;
}
.log-editor form {
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  max-height: 92dvh;
}
.log-editor .dialog-body {
  overflow: auto;
  padding: 22px 24px;
}
.log-layout {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 3fr);
  align-items: start;
  gap: 24px;
}
.log-context, .log-writing {
  display: grid;
  align-content: start;
  min-width: 0;
  gap: 15px;
}
.log-context {
  background: #f6f8fc;
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 16px;
}
.log-checks {
  min-inline-size: 0;
  margin: 0;
  padding: 0;
  border: 0;
}
.log-checks legend {
  margin-bottom: 7px;
  padding: 0;
  font-size: 13px;
  font-weight: 700;
}
.log-checks .check-grid label { background: white; }
.log-checks .check-grid label:has(input:checked) {
  background: #eaf1ff;
  border-color: #8aa9ed;
}
.log-writing textarea {
  line-height: 1.6;
  padding: 11px;
}
.log-photos {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 10px;
}
.log-photos > div { min-width: 0; }
.log-photos .field input { width: 100%; }
@media(max-width: 720px) {
