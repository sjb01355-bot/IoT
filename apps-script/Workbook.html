<script>
const xlsxMime = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
const officeRelationships = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
const sheetNamespace = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const xmlDeclaration = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
const xmlText = (value) => String(value ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\uFFFE\uFFFF]/g,'')
  .replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'})[char]);

function workbookRelationships(items) {
  return '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+items.map(
    ([type,target],index)=>'<Relationship Id="rId'+(index+1)+'" Type="'+officeRelationships+'/'+type+'" Target="'+target+'"/>'
  ).join('')+'</Relationships>';
}

function workbookStyles() {
  const fonts = [
    [11,'FF21344B',false], [21,'FFFFFFFF',true], [10,'FFE1F1FC',false],
    [11,'FFFFFFFF',true], [10,'FF244B64',true], [11,'FF116B5C',true], [10,'FF586A80',false],
  ].map(([size,color,bold])=>'<font>'+(bold?'<b/>':'')+'<sz val="'+size+'"/><color rgb="'+color+'"/><name val="맑은 고딕"/></font>');
  const fills = ['FF173B61','FF206A72','FFEAF3F7','FFF3F7FB','FFE5F5EF'].map(color=>
    '<fill><patternFill patternType="solid"><fgColor rgb="'+color+'"/><bgColor indexed="64"/></patternFill></fill>');
  const border = ['left','right','top','bottom'].map(side=>'<'+side+' style="thin"><color rgb="FFD8E3EC"/></'+side+'>').join('');
  const formats = [
    [0,0,0], [1,2,0], [2,2,0], [3,3,0], [4,4,1],
    [0,0,1], [4,5,1], [5,6,1], [6,5,1], [0,5,1],
  ].map(([font,fill,borderId],i)=>{
    const centered = [1,7,8].includes(i);
    return '<xf numFmtId="0" fontId="'+font+'" fillId="'+fill+'" borderId="'+borderId+
      '" xfId="0" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="'+
      (centered?'center':'left')+'" vertical="'+(i===5?'top':'center')+'" wrapText="1"'+(centered?'':' indent="1"')+'/></xf>';
  });
  return '<styleSheet xmlns="'+sheetNamespace+'"><fonts count="'+fonts.length+'">'+fonts.join('')+'</fonts>'+
    '<fills count="'+(fills.length+2)+'"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>'+
    fills.join('')+'</fills><borders count="2"><border><left/><right/><top/><bottom/><diagonal/></border><border>'+
    border+'<diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="'+formats.length+'">'+formats.join('')+'</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>';
}

// Split extensive notes across rows so Excel's maximum row height never hides text.
function noteBlocks(value) {
  if (!value) return [{text:'—',height:57}];
  const blocks = [];
  let text = '', width = 0, lines = 1;
  for (const char of value.replace(/\r\n?/g,'\n')) {
    const weight = char === '\t' ? 4 : (/[^\x20-\x7e]/u.test(char) ? 2 : 1);
    if (char === '\n' || width+weight>78) {
      if (lines===16) {
        blocks.push({text,height:272});
        text = '';
        lines = 1;
      } else lines++;
      width = 0;
    }
    text += char;
    if (char !== '\n') width += weight;
  }
  blocks.push({text,height:Math.max(57,lines*16+16)});
  return blocks;
}

async function workbookPhoto(dataUrl) {
  if (!dataUrl) return null;
  const image = new Image();
  image.src = dataUrl;
  await image.decode();
  const scale = Math.min(1, 600/image.naturalWidth, 300/image.naturalHeight);
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1,Math.round(image.naturalWidth*scale));
  canvas.height = Math.max(1,Math.round(image.naturalHeight*scale));
  const context = canvas.getContext('2d');
  context.fillStyle = '#fff';
  context.fillRect(0,0,canvas.width,canvas.height);
  context.drawImage(image,0,0,canvas.width,canvas.height);
  const blob = await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.9));
  return {width:canvas.width,height:canvas.height,bytes:new Uint8Array(await blob.arrayBuffer())};
}

function workbookSheet(log, participant, photo) {
  const rows = [], merges = [];
  function add(height, cells = []) {
    const row = rows.length+1;
    const entries = cells.flatMap(([first,last,value,style])=>{
      if (first!==last) merges.push(first+row+':'+last+row);
      return 'ABCDEFGH'.slice(first.charCodeAt(0)-65,last.charCodeAt(0)-64).split('').map((column,index)=>
        '<c r="'+column+row+'" s="'+style+'"'+(index===0? ' t="inlineStr"><is><t xml:space="preserve">'+
          xmlText(value)+'</t></is></c>' : '/>'));
    });
    rows.push('<row r="'+row+'" ht="'+height+'" customHeight="1">'+entries.join('')+'</row>');
    return row;
  }
  const full = (height,value,style)=>add(height,[['A','H',value,style]]);
  const fields = (label,value,label2,value2)=>add(27,[
    ['A','B',label,4],['C','D',value||'—',9],['E','F',label2,4],['G','H',value2||'—',9],
  ]);
  full(37,'IoT 모니터링 일지',1);
  full(23,'경기북부 성인장애인 IoT 보급사업',2);
  add(10);
  full(24,'상담 기본 정보',3);
  fields('참여자',participant?.name,'지역',participant?.region);
  fields('상담 날짜',log.date,'상담 시간',log.time);
  add(27,[['A','B','상담 유형',4],['C','H',log.channels.join(' · ')||'—',9]]);
  add(10);
  full(24,'기기 점검',3);
  add(23,[['A','C','기기',4],['D','D','점검 여부',4],['E','G','기기',4],['H','H','점검 여부',4]]);
  const devices = [...new Set([...state.devices,...log.checks])];
  const midpoint = Math.ceil(devices.length/2);
  const checked = new Set(log.checks);
  for (let i=0;i<midpoint;i++) {
    const left = devices[i], right = devices[i+midpoint];
    const mark = (device)=>device?(checked.has(device)?'점검':'—'):'';
    add(20,[['A','C',left,9],['D','D',mark(left),checked.has(left)?7:8],
      ['E','G',right||'',9],['H','H',mark(right),checked.has(right)?7:8]]);
  }
  for (const [label,body] of [['상담 내용',log.content],['슈퍼비전',log.supervision]]) {
    add(10);
    full(24,label,3);
    noteBlocks(body).forEach(block=>full(block.height,block.text,5));
  }
  add(10);
  full(24,'첨부 사진',3);
  const photoRow = photo ? full(Math.ceil(photo.height*.75)+23,'',9) : full(28,'첨부 사진 없음',9);
  const sheet = '<worksheet xmlns="'+sheetNamespace+'" xmlns:r="'+officeRelationships+'">'+
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr><dimension ref="A1:H'+rows.length+'"/>'+
    '<sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>'+
    '<sheetFormatPr defaultRowHeight="15"/><cols><col min="1" max="8" width="12" customWidth="1"/></cols>'+
    '<sheetData>'+rows.join('')+'</sheetData><mergeCells count="'+merges.length+'">'+merges.map(ref=>'<mergeCell ref="'+ref+'"/>').join('')+
    '</mergeCells><printOptions horizontalCentered="1"/><pageMargins left="0.32" right="0.32" top="0.45" bottom="0.45" header="0.2" footer="0.2"/>'+
    '<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/>'+
    (photo?'<drawing r:id="rId1"/>':'')+'</worksheet>';
  return {sheet, photoRow,lastRow:rows.length};
}

function workbookDrawing(photo, row) {
  const cx = photo.width*9525, cy = photo.height*9525;
  return '<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing"'+
    ' xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:r="'+officeRelationships+'">'+
    '<xdr:oneCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>114300</xdr:colOff><xdr:row>'+(row-1)+
    '</xdr:row><xdr:rowOff>114300</xdr:rowOff></xdr:from><xdr:ext cx="'+cx+'" cy="'+cy+'"/>'+
    '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="1" name="모니터링 첨부 사진"/><xdr:cNvPicPr/></xdr:nvPicPr>'+
    '<xdr:blipFill><a:blip r:embed="rId1"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'+
    '<xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic>'+
    '<xdr:clientData/></xdr:oneCellAnchor></xdr:wsDr>';
}

async function createLogWorkbook(log, participant) {
  const photo = await workbookPhoto(log.photo);
  const {sheet,photoRow,lastRow} = workbookSheet(log,participant,photo);
  const overrides = [
    ['/xl/workbook.xml','spreadsheetml.sheet.main'],
    ['/xl/worksheets/sheet1.xml','spreadsheetml.worksheet'],
    ['/xl/styles.xml','spreadsheetml.styles'],
  ];
  if (photo) overrides.push(['/xl/drawings/drawing1.xml','drawingml.drawing']);
  const contentTypes = '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    (photo?'<Default Extension="jpg" ContentType="image/jpeg"/>':'')+
    overrides.map(([part,type])=>'<Override PartName="'+part+'" ContentType="application/vnd.openxmlformats-officedocument.'+type+'+xml"/>').join('')+'</Types>';
  const name = '모니터링 일지';
  const workbook = '<workbook xmlns="'+sheetNamespace+'" xmlns:r="'+officeRelationships+'">'+
    '<bookViews><workbookView/></bookViews><sheets><sheet name="'+name+'" sheetId="1" r:id="rId1"/></sheets>'+
    '<definedNames><definedName name="_xlnm.Print_Area" localSheetId="0">\''+name+'\'!$A$1:$H$'+lastRow+
    '</definedName></definedNames></workbook>';
  const parts = new Map([
    ['[Content_Types].xml',contentTypes],
    ['_rels/.rels',workbookRelationships([['officeDocument','xl/workbook.xml']])],
    ['xl/workbook.xml',workbook],
    ['xl/_rels/workbook.xml.rels',workbookRelationships([['worksheet','worksheets/sheet1.xml'],['styles','styles.xml']])],
    ['xl/styles.xml',workbookStyles()],
    ['xl/worksheets/sheet1.xml',sheet],
  ]);
  if (photo) {
    parts.set('xl/worksheets/_rels/sheet1.xml.rels',workbookRelationships([['drawing','../drawings/drawing1.xml']]));
    parts.set('xl/drawings/drawing1.xml',workbookDrawing(photo,photoRow));
    parts.set('xl/drawings/_rels/drawing1.xml.rels',workbookRelationships([['image','../media/photo.jpg']]));
    parts.set('xl/media/photo.jpg',photo.bytes);
  }
  return zipWorkbook(parts);
}

function zipWorkbook(parts) {
  const encoder = new TextEncoder();
  const local = [], central = [];
  let offset = 0, centralSize = 0;
  const crcTable = Array.from({length:256},(_,value)=>{
    for (let bit=0;bit<8;bit++) value = (value>>>1) ^ ((value&1)?0xedb88320:0);
    return value>>>0;
  });
  // OOXML packages are ZIP archives. Method 0 stores each part without compression.
  const header = (size,fields)=>{
    const bytes = new Uint8Array(size);
    const view = new DataView(bytes.buffer);
    for (const [position,value] of fields) view.setUint32(position,value,true);
    return bytes;
  };
  for (const [path,content] of parts) {
    const name = encoder.encode(path);
    const data = typeof content==='string' ? encoder.encode(xmlDeclaration+content) : content;
    let crc = 0xffffffff;
    for (const byte of data) crc = (crc>>>8) ^ crcTable[(crc^byte)&255];
    crc = (crc^0xffffffff)>>>0;
    const entry = header(30,[[0,0x04034b50],[4,20],[10,0x00210000],[14,crc],[18,data.length],[22,data.length],[26,name.length]]);
    const index = header(46,[[0,0x02014b50],[4,0x00140014],[12,0x00210000],[16,crc],[20,data.length],[24,data.length],[28,name.length],[42,offset]]);
    local.push(entry,name,data);
    central.push(index,name);
    offset += entry.length+name.length+data.length;
    centralSize += index.length+name.length;
  }
  const end = header(22,[[0,0x06054b50],[8,parts.size|(parts.size<<16)],[12,centralSize],[16,offset]]);
  return new Blob([...local,...central,end],{type:xlsxMime});
}
</script>
